name: CI — Quotes API Auth Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    name: Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Day3/Task3/IntegrationTests/Day3.IntegrationTests.csproj

      - name: Build
        run: dotnet build Day3/Task3/IntegrationTests/Day3.IntegrationTests.csproj --no-restore --configuration Release

      - name: Run integration tests
        run: >
          dotnet test Day3/Task3/IntegrationTests/Day3.IntegrationTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
