name: Day5 Task1 CI

on:
  push:
    branches: [main]
    paths:
      - day5/Task1/**
      - .github/workflows/day5-task1-ci.yml
  pull_request:
    branches: [main]
    paths:
      - day5/Task1/**
      - .github/workflows/day5-task1-ci.yml

jobs:
  build-and-test-task1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Day5 Task1
        run: dotnet restore day5/Task1/Day3.csproj

      - name: Build Day5 Task1
        run: dotnet build day5/Task1/Day3.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test day5/Task1/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test day5/Task1/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --configuration Release --verbosity normal