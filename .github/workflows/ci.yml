name: Day4 Task2 CI

on:
  push:
    branches: [main]
    paths:
      - day4/Task2/**
      - day4/Task1/Day3/Task6/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - day4/Task2/**
      - day4/Task1/Day3/Task6/**
      - .github/workflows/ci.yml

jobs:
  task2-coverage:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Task2 coverage merge script
        working-directory: day4/Task2
        run: ./_coverage_merge.ps1 | Tee-Object -FilePath coverage-merge-output.txt

      - name: Enforce 80 percent merged line coverage
        working-directory: day4/Task2
        run: |
          $output = Get-Content -Raw ./coverage-merge-output.txt
          $match = [regex]::Match($output, 'Merged line coverage \(class\+line\): Covered=\d+ Valid=\d+ Percent=([0-9]+(\.[0-9]+)?)%')
          if (-not $match.Success) {
            throw 'Could not parse merged coverage percent from _coverage_merge.ps1 output.'
          }

          $percent = [double]$match.Groups[1].Value
          Write-Host "Merged line coverage: $percent%"
          if ($percent -lt 80) {
            throw "Coverage gate failed. Required >= 80%, got $percent%."
          }

      - name: Upload Task2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day4-task2-results
          path: |
            day4/Task2/coverage-merge-output.txt
            day4/Task1/Day3/Task6/**/TestResults/**/*.trx
            day4/Task1/Day3/Task6/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore