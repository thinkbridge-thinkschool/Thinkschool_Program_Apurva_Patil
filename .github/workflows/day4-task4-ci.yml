name: Day4 Task4 CI

on:
  push:
    branches: [main]
    paths:
      - day4/Task4/**
      - .github/workflows/day4-task4-ci.yml
  pull_request:
    branches: [main]
    paths:
      - day4/Task4/**
      - .github/workflows/day4-task4-ci.yml

jobs:
  build-and-test-task4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Task4 dependencies
        run: dotnet restore day4/Task4/Day3.csproj

      - name: Build Task4
        run: dotnet build day4/Task4/Day3.csproj --configuration Release --no-restore

      - name: Run Task4 unit tests
        run: dotnet test day4/Task4/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --configuration Release --verbosity normal

      - name: Run Task4 integration tests
        run: dotnet test day4/Task4/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --configuration Release --verbosity normal
